<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FxTwitter Search Viewer</title>
<style>
:root{--bg:#fff;--text:#0f1419;--sub:#536471;--line:#eff3f4;--blue:#1d9bf0;--hover:#f7f9f9}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif}
.app{width:min(100%,640px);margin:auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:20px;margin:0 0 10px}.title-button{padding:2px 4px;background:transparent;color:var(--text);font-size:20px;border-radius:8px}.title-button:hover{background:var(--hover);opacity:1}.title-caret{font-size:15px;color:var(--sub)}
.command-menu{position:fixed;z-index:80;top:0;left:50%;transform:translateX(-50%);width:min(100%,640px);max-height:100vh;overflow:auto;background:white;border:1px solid var(--line);box-shadow:0 12px 36px #0003;padding:16px}.command-menu[hidden]{display:none}.command-menu-head{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}.command-menu-head strong{font-size:20px}.command-help{font-size:13px;color:var(--sub);margin-top:4px}.command-close{width:36px;height:36px;padding:0;background:var(--text);font-size:21px}.command-section{padding:13px 0;border-bottom:1px solid var(--line)}.command-label{display:block;font-weight:700;margin-bottom:8px}.command-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.command-input{min-width:0;flex:1;border:1px solid #cfd9de;border-radius:9px;background:white;padding:9px 10px}.command-input:focus{border-color:var(--blue)}.command-action,.command-chip{background:#eff3f4;color:var(--text);padding:9px 12px;border:1px solid transparent}.command-action:hover,.command-chip:hover{background:#dfe8ed;opacity:1}.command-action:active,.command-chip:active{transform:scale(.97)}.command-message{min-height:18px;margin-top:6px;font-size:13px;color:#c33}.command-input.input-error{border-color:#f4212e;box-shadow:0 0 0 1px #f4212e}.command-chip.selected,.command-action.selected{background:#e8f5fd;color:#0878bd;border-color:var(--blue)}.command-grid{display:flex;flex-wrap:wrap;gap:7px}.date-row label,.count-row label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}.date-input{flex:none;width:auto}.count-input{flex:none;width:80px}.command-menu-foot{position:sticky;bottom:-16px;display:flex;justify-content:space-between;gap:10px;margin:0 -16px -16px;padding:12px 16px;background:white;border-top:1px solid var(--line)}.primary-button{background:var(--blue);padding:10px 18px}.secondary-button{background:#eff3f4;color:var(--text);padding:10px 18px}@media(max-width:520px){.command-menu{padding:12px}.command-menu-foot{margin-left:-12px;margin-right:-12px;margin-bottom:-12px}.command-action{flex:1}.date-row label,.count-row label{width:100%;justify-content:space-between}.date-input,.count-input{width:58%}}.search{display:flex;gap:8px}.searchbox{flex:1;display:flex;align-items:center;background:#eff3f4;border:1px solid transparent;border-radius:999px;padding:0 14px}.searchbox:focus-within{background:white;border-color:var(--blue)}
input{width:100%;border:0;outline:0;background:transparent;font-size:15px;padding:11px 7px;color:var(--text)}button{border:0;border-radius:999px;background:var(--text);color:white;font-weight:700;padding:0 18px;cursor:pointer}button:hover{opacity:.85}button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;margin:10px -16px -10px}.tab{flex:1;text-align:center;padding:12px 4px;color:var(--sub);cursor:pointer;position:relative;font-weight:600}.tab.active{color:var(--text)}.tab.active:after{content:"";height:4px;width:56px;border-radius:4px;background:var(--blue);position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.status,.empty{padding:28px 24px;text-align:center;color:var(--sub)}
.post{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);color:inherit;cursor:pointer}.post:hover{background:var(--hover)}
.account-link{cursor:pointer}.account-link:hover{text-decoration:underline}.avatar.account-link:hover{filter:brightness(.92);text-decoration:none}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#cfd9de;flex:0 0 auto}.content{min-width:0;flex:1}.meta{display:flex;gap:4px;align-items:center;min-width:0;font-size:15px}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.verified{color:var(--blue);font-size:14px}.handle,.dot,.time{color:var(--sub);white-space:nowrap}.handle{overflow:hidden;text-overflow:ellipsis}.text{font-size:15px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}.media{display:grid;gap:2px;margin-top:10px;border:1px solid #cfd9de;border-radius:16px;overflow:hidden;grid-template-columns:repeat(2,1fr)}.media.one{grid-template-columns:1fr}.media img,.media video{width:100%;height:100%;max-height:430px;object-fit:cover;display:block}.media:not(.one)>*{aspect-ratio:1.45}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;margin-top:10px;color:var(--sub);font-size:13px}.metric{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0}.icon{font-size:16px}.notice{padding:9px 16px;background:#fff8dc;border-bottom:1px solid #eadca6;color:#5c4a00;font-size:13px}.load{display:block;margin:16px auto;padding:10px 28px;background:var(--blue)}
.external{position:relative}.external button{background:transparent;color:var(--sub);padding:2px 8px;font-size:19px;line-height:1}.external-menu{display:none;position:absolute;right:0;bottom:30px;min-width:190px;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px #0002;padding:6px;z-index:30}.external-menu.open{display:block}.external-menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:600;white-space:nowrap}.external-menu a:hover{background:var(--hover)}
.modal{display:none;position:fixed;inset:0;z-index:100;background:#0009;align-items:flex-start;justify-content:center;padding:32px 12px;overflow:auto}.modal.open{display:flex}.dialog{position:relative;width:min(100%,640px);background:white;border-radius:16px;overflow:hidden}.close{position:absolute;top:10px;right:10px;z-index:4;width:36px;height:36px;padding:0;background:#0f1419cc;font-size:22px}.dialog .post{cursor:default;border:0}.detail-nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:54px;padding:0 12px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.detail-back{width:36px;height:36px;padding:0;background:transparent;color:var(--text);font-size:23px}.detail-back:hover{background:var(--hover);opacity:1}.detail-back:disabled{visibility:hidden}.close.detail-close{position:static;margin-left:auto}.detail-original{border-bottom:8px solid var(--line)}.reply-heading{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700}.reply-order{font-size:13px;color:var(--sub);font-weight:500}.reply-list .post{border-bottom:1px solid var(--line);padding-top:12px}.reply-loading,.reply-empty,.reply-error{padding:22px 16px;text-align:center;color:var(--sub)}.reply-more{display:block;margin:14px auto 18px;background:var(--blue);padding:9px 22px}.lightbox .dialog{width:min(96vw,1100px);background:#000;display:flex;justify-content:center}.lightbox img{max-width:100%;max-height:88vh;object-fit:contain}.lightbox .close{background:#ffffff33}
.roll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;background:var(--line)}.roll-item{position:relative;aspect-ratio:1;overflow:hidden;background:#cfd9de;cursor:pointer}.roll-item img,.roll-item video{width:100%;height:100%;object-fit:cover;display:block}.roll-item:hover{filter:brightness(.9)}.roll-video{position:absolute;right:8px;top:7px;color:white;text-shadow:0 1px 4px #000;font-size:18px}.profile-head{padding:20px 16px 16px;border-bottom:1px solid var(--line)}.profile-back{background:transparent;color:var(--text);padding:6px 0;margin-bottom:12px}.profile-main{display:flex;gap:14px;align-items:center}.profile-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;background:#cfd9de}.profile-name{font-size:21px;font-weight:800}.profile-handle{color:var(--sub);margin-top:2px}.profile-bio{margin-top:12px;white-space:pre-wrap;line-height:1.4}.profile-label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}.profile-label-title{font-weight:700}.profile-sort{display:flex;background:#eff3f4;border-radius:999px;padding:3px}.profile-sort button{background:transparent;color:var(--sub);padding:6px 13px;font-size:13px}.profile-sort button.active{background:white;color:var(--text);box-shadow:0 1px 4px #0002}body.modal-open{overflow:hidden}
@media(max-width:640px){.app{border:0}.post{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
<header>
<h1><button type="button" id="commandMenuButton" class="title-button" aria-expanded="false">検索 <span class="title-caret">⌄</span></button></h1>
<form class="search" id="form"><div class="searchbox">⌕<input id="query" autocomplete="off" placeholder="キーワードを入力"></div><button id="searchButton">検索</button></form>
<div class="tabs" id="tabs"><div class="tab active" data-feed="latest">最新</div><div class="tab" data-feed="top">話題</div><div class="tab" data-feed="media">メディア</div><div class="tab" data-feed="roll">ロール</div></div>
</header>
<section id="commandMenu" class="command-menu" hidden>
  <div class="command-menu-head">
    <div><strong>検索コマンド</strong><div class="command-help">項目を押すと検索欄へ追加されます。もう一度押すと解除できます。</div></div>
    <button type="button" id="commandMenuClose" class="command-close" aria-label="閉じる">×</button>
  </div>

  <div class="command-section">
    <label class="command-label" for="commandKeyword">キーワード・完全一致</label>
    <div class="command-row">
      <input id="commandKeyword" class="command-input" placeholder="検索語を入力">
      <button type="button" class="command-action" data-action="keyword">入力した語を追加</button>
      <button type="button" class="command-action" data-action="phrase">入力した語を完全一致で追加</button>
    </div>
    <div id="commandMessage" class="command-message" role="status"></div>
  </div>

  <div class="command-section">
    <div class="command-label">投稿者・宛先</div>
    <div class="command-row">
      <input id="commandUser" class="command-input" placeholder="@を除いたユーザー名">
      <button type="button" class="command-action" data-prefix="from:">投稿者</button>
      <button type="button" class="command-action" data-prefix="to:">宛先</button>
      <button type="button" class="command-action" data-prefix="@">メンション</button>
    </div>
  </div>

  <div class="command-section">
    <div class="command-label">言語</div>
    <div class="command-grid">
      <button type="button" class="command-chip" data-token="lang:ja">日本語</button>
      <button type="button" class="command-chip" data-token="lang:en">英語</button>
      <button type="button" class="command-chip" data-token="lang:ko">韓国語</button>
      <button type="button" class="command-chip" data-token="lang:zh">中国語</button>
    </div>
  </div>

  <div class="command-section">
    <div class="command-label">画像・動画・リンク</div>
    <div class="command-grid">
      <button type="button" class="command-chip" data-token="has:images">画像あり</button>
      <button type="button" class="command-chip" data-token="has:videos">動画あり</button>
      <button type="button" class="command-chip" data-token="filter:media">画像・動画</button>
      <button type="button" class="command-chip" data-token="filter:links">リンクあり</button>
      <button type="button" class="command-chip" data-token="-filter:links">リンクなし</button>
    </div>
  </div>

  <div class="command-section">
    <div class="command-label">返信・リポスト</div>
    <div class="command-grid">
      <button type="button" class="command-chip" data-token="-is:retweet">リポストを除外</button>
      <button type="button" class="command-chip" data-token="-is:reply">返信を除外</button>
      <button type="button" class="command-chip" data-token="is:retweet">リポストだけ</button>
      <button type="button" class="command-chip" data-token="is:reply">返信だけ</button>
    </div>
  </div>

  <div class="command-section">
    <div class="command-label">期間</div>
    <div class="command-row date-row">
      <label>開始日 <input id="commandSince" class="command-input date-input" type="date"></label>
      <label>終了日より前 <input id="commandUntil" class="command-input date-input" type="date"></label>
      <button type="button" class="command-action" data-action="date">期間を追加</button>
    </div>
  </div>

  <div class="command-section">
    <div class="command-label">最低反応数</div>
    <div class="command-row count-row">
      <label>いいね <input id="commandFaves" class="command-input count-input" type="number" min="0" placeholder="100"></label>
      <label>リポスト <input id="commandRetweets" class="command-input count-input" type="number" min="0" placeholder="20"></label>
      <label>返信 <input id="commandReplies" class="command-input count-input" type="number" min="0" placeholder="10"></label>
      <button type="button" class="command-action" data-action="counts">反応数を追加</button>
    </div>
  </div>

  <div class="command-menu-foot">
    <button type="button" id="commandClear" class="secondary-button">検索欄を空にする</button>
    <button type="button" id="commandDone" class="primary-button">入力を完了</button>
  </div>
</section>
<main id="results"><div class="empty">検索語を入力してください。</div></main>
<button class="load" id="loadMore" hidden>さらに読み込む</button>
</div>
<div class="modal" id="detailModal"><div class="dialog"><div class="detail-nav"><button type="button" id="detailBack" class="detail-back" aria-label="前の投稿へ戻る">←</button><strong>投稿</strong><button class="close detail-close" aria-label="閉じる">×</button></div><div id="detailBody"></div></div></div>
<div class="modal lightbox" id="imageModal"><div class="dialog"><button class="close" aria-label="閉じる">×</button><img id="largeImage" alt="投稿画像の拡大表示"></div></div>
<script>
const API='https://api.fxtwitter.com/2/search';
let feed='latest', viewMode='posts', cursor=null, loading=false, profileHandle='', profileFeed='latest';
const $=s=>document.querySelector(s), results=$('#results'), loadMore=$('#loadMore');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>{n=Number(n||0);return n>=10000?(n/10000).toFixed(n>=100000?0:1).replace('.0','')+'万':n.toLocaleString('ja-JP')};
function relative(d){const t=new Date(d), sec=(Date.now()-t)/1000;if(!isFinite(sec))return '';if(sec<60)return Math.max(1,Math.floor(sec))+'秒';if(sec<3600)return Math.floor(sec/60)+'分';if(sec<86400)return Math.floor(sec/3600)+'時間';if(sec<604800)return Math.floor(sec/86400)+'日';return `${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`}
function mediaHTML(s){const m=s.media?.all||[...(s.media?.photos||[]),...(s.media?.videos||[])];if(!m?.length)return '';return `<div class="media ${m.length===1?'one':''}">${m.slice(0,4).map(x=>{const url=x.url||x.thumbnail_url||x.thumbnail||x.media_url_https;const video=x.url||x.playback_url;return (x.type==='video'||x.type==='gif')&&video?.match(/\.(mp4|webm)(\?|$)/i)?`<video class="post-video" controls preload="metadata" poster="${esc(x.thumbnail_url||x.thumbnail||'')}"><source src="${esc(video)}"></video>`:`<img class="post-image" loading="lazy" src="${esc(url)}" alt="投稿画像">`}).join('')}</div>`}
function postHTML(s,detail=false){const a=s.author||{};const handle=a.screen_name||a.username||'';const url=s.url||`https://x.com/${handle}/status/${s.id}`;const avatar=a.avatar_url||a.avatar||a.profile_image_url_https||'';const text=s.text||s.raw_text||'';const verified=a.verification?.verified||a.verified;return `<article class="post" data-id="${esc(s.id||'')}"><img class="avatar account-link" data-handle="${esc(handle)}" src="${esc(avatar)}" alt="${esc(a.name||handle)}"><div class="content"><div class="meta"><span class="name account-link" data-handle="${esc(handle)}">${esc(a.name||handle)}</span>${verified?'<span class="verified">●</span>':''}<span class="handle account-link" data-handle="${esc(handle)}">@${esc(handle)}</span><span class="dot">·</span><span class="time">${esc(relative(s.created_at||s.date))}</span></div><div class="text">${esc(text)}</div>${mediaHTML(s)}<div class="metrics"><span class="metric"><span class="icon">◯</span>${num(s.replies||s.reply_count)}</span><span class="metric"><span class="icon">↻</span>${num(s.retweets||s.reposts||s.retweet_count)}</span><span class="metric"><span class="icon">♡</span>${num(s.likes||s.favorite_count)}</span><span class="metric"><span class="icon">▥</span>${num(s.views||s.view_count)}</span><span class="metric external"><button type="button" class="menu-button" aria-label="外部メニュー">•••</button><span class="external-menu"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Xで元の投稿を開く ↗</a></span></span></div></div></article>`}
function mediaItems(s){return s.media?.all||[...(s.media?.photos||[]),...(s.media?.videos||[])]}
function rollHTML(items){const cells=[];items.forEach(post=>mediaItems(post).forEach(m=>{const src=m.thumbnail_url||m.thumbnail||m.media_url_https||m.url;const video=m.type==='video'||m.type==='gif';if(src)cells.push(`<div class="roll-item" data-id="${esc(post.id||'')}"><img loading="lazy" src="${esc(src)}" alt="メディア">${video?'<span class="roll-video">▶</span>':''}</div>`)}));return `<div class="roll-grid">${cells.join('')}</div>`}
function profileHeader(a){const handle=a.screen_name||a.username||'';const avatar=a.avatar_url||a.avatar||a.profile_image_url_https||'';const bio=a.description||a.bio||'';return `<section class="profile-head"><button type="button" class="profile-back">← 検索結果へ戻る</button><div class="profile-main"><img class="profile-avatar" src="${esc(avatar)}" alt=""><div><div class="profile-name">${esc(a.name||handle)}</div><div class="profile-handle">@${esc(handle)}</div></div></div>${bio?`<div class="profile-bio">${esc(bio)}</div>`:''}</section><div class="profile-label"><span class="profile-label-title">投稿</span><span class="profile-sort"><button type="button" class="profile-sort-button ${profileFeed==='latest'?'active':''}" data-profile-feed="latest">最新順</button><button type="button" class="profile-sort-button ${profileFeed==='top'?'active':''}" data-profile-feed="top">人気順</button></span></div>`}
async function openProfile(handle){if(profileHandle&&profileHandle.toLowerCase()!==handle.toLowerCase())profileFeed='latest';const source=[...postStore.values()].find(x=>{const a=x.author||{};return (a.screen_name||a.username||'').toLowerCase()===handle.toLowerCase()});const author=source?.author||{screen_name:handle,name:handle};profileHandle=handle;viewMode='profile';cursor=null;results.innerHTML=profileHeader(author)+'<div class="status">投稿を取得中...</div>';loadMore.hidden=true;try{const u=new URL(API);u.searchParams.set('q','from:'+handle);u.searchParams.set('feed',profileFeed);u.searchParams.set('count','30');const r=await fetch(u,{headers:{Accept:'application/json'}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||`HTTP ${r.status}`);const items=(data.results||[]).filter(x=>x&&x.type!=='tombstone');items.forEach(x=>postStore.set(String(x.id||''),x));results.querySelector('.status').outerHTML=items.map(x=>postHTML(x)).join('')||'<div class="empty">公開投稿が見つかりません。</div>';cursor=data.cursor?.bottom||null;loadMore.hidden=!cursor;history.replaceState({fxView:'profile',handle,profileFeed},'',`#profile=${encodeURIComponent(handle)}&profileFeed=${profileFeed}`)}catch(e){results.querySelector('.status').textContent='アカウントの投稿を取得できませんでした: '+e.message}}
let postStore=new Map();
let detailPostId='',detailReplyCursor=null,detailLoading=false,detailHistory=[],applyingPopState=false;
function replySectionHTML(){return `<div class="reply-heading"><span>返信</span><span class="reply-order">人気順</span></div><div id="replyList" class="reply-list"><div class="reply-loading">返信を取得中...</div></div><button type="button" id="replyMore" class="reply-more" hidden>返信をさらに表示</button>`}
function normalizeConversationItem(x){return x?.status||x?.tweet||x}
async function loadReplies(append=false){if(detailLoading||!detailPostId)return;detailLoading=true;const more=$('#replyMore');if(more)more.disabled=true;try{const u=new URL(`${API.replace('/search','')}/conversation/${detailPostId}`);u.searchParams.set('ranking_mode','likes');if(append&&detailReplyCursor)u.searchParams.set('cursor',detailReplyCursor);const r=await fetch(u,{headers:{Accept:'application/json'}});const data=await r.json().catch(()=>({}));if(!r.ok||data.code>=400)throw new Error(data.message||data.error||`HTTP ${r.status}`);const replies=(data.replies||[]).map(normalizeConversationItem).filter(x=>x&&x.type!=='tombstone'&&x.id);replies.forEach(x=>postStore.set(String(x.id),x));const html=replies.map(x=>postHTML(x,true)).join('');const list=$('#replyList');if(append)list.insertAdjacentHTML('beforeend',html);else list.innerHTML=html||'<div class="reply-empty">表示できる返信はありません。</div>';const next=data.cursor?.bottom;detailReplyCursor=next&&next!==detailReplyCursor?next:null;const button=$('#replyMore');if(button)button.hidden=!detailReplyCursor}catch(e){const list=$('#replyList');if(list)list.innerHTML=`<div class="reply-error">返信を取得できませんでした: ${esc(e.message)}</div>`;const button=$('#replyMore');if(button)button.hidden=true}finally{detailLoading=false;const button=$('#replyMore');if(button)button.disabled=false}}
function renderDetail(id){const post=postStore.get(String(id));if(!post)return;detailPostId=String(id);detailReplyCursor=null;$('#detailBody').innerHTML=`<div class="detail-original">${postHTML(post,true)}</div>${replySectionHTML()}`;$('#detailBack').disabled=detailHistory.length===0;$('#detailModal').classList.add('open');document.body.classList.add('modal-open');loadReplies(false)}
function openModal(id,pushHistory=false){const target=String(id);const modalOpen=$('#detailModal').classList.contains('open');if(pushHistory&&detailPostId&&detailPostId!==target)detailHistory.push(detailPostId);else if(!modalOpen)detailHistory=[];renderDetail(target);if(!applyingPopState){const state={...(history.state||{}),fxView:'detail',postId:target};history.pushState(state,'',`#post=${encodeURIComponent(target)}`)}}
function detailGoBack(){history.back()}
function hideModals(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'));document.body.classList.remove('modal-open');document.querySelectorAll('video').forEach(v=>v.pause())}
function closeModals(){if($('#detailModal').classList.contains('open')&&history.state?.fxView==='detail'&&!applyingPopState){history.back();return}hideModals();detailHistory=[]}
function wireInteractions(root=document){root.addEventListener('click',e=>{const detailBack=e.target.closest('#detailBack');if(detailBack){e.stopPropagation();detailGoBack();return}const replyMore=e.target.closest('#replyMore');if(replyMore){e.stopPropagation();loadReplies(true);return}const sort=e.target.closest('.profile-sort-button');if(sort){e.stopPropagation();profileFeed=sort.dataset.profileFeed;openProfile(profileHandle);return}const back=e.target.closest('.profile-back');if(back){viewMode='posts';profileHandle='';search(false);return}const account=e.target.closest('.account-link');if(account){e.stopPropagation();openProfile(account.dataset.handle);return}const roll=e.target.closest('.roll-item');if(roll){e.stopPropagation();openModal(roll.dataset.id);return}const close=e.target.closest('.close');if(close){closeModals();return}const ext=e.target.closest('.external');if(ext){e.stopPropagation();const btn=e.target.closest('.menu-button');if(btn){document.querySelectorAll('.external-menu.open').forEach(x=>{if(x!==btn.nextElementSibling)x.classList.remove('open')});btn.nextElementSibling.classList.toggle('open')}return}const img=e.target.closest('.post-image');if(img){e.stopPropagation();$('#largeImage').src=img.src;$('#imageModal').classList.add('open');document.body.classList.add('modal-open');return}if(e.target.closest('video')){e.stopPropagation();return}const post=e.target.closest('.post');if(post){const isReply=!post.closest('.detail-original')&&post.closest('.reply-list');if(!post.closest('#detailBody'))openModal(post.dataset.id,false);else if(isReply)openModal(post.dataset.id,true)}});}
async function search(append=false){const q=$('#query').value.trim();if(!q||loading)return;loading=true;$('#searchButton').disabled=true;loadMore.disabled=true;if(!append){cursor=null;results.innerHTML='<div class="status">検索中...</div>';loadMore.hidden=true}try{const u=new URL(API);u.searchParams.set('q',q);u.searchParams.set('feed',viewMode==='roll'?'media':(viewMode==='profile'?'latest':feed));u.searchParams.set('count','30');if(cursor)u.searchParams.set('cursor',cursor);const r=await fetch(u,{headers:{'Accept':'application/json'}});const data=await r.json().catch(()=>({}));if(!r.ok||data.code>=400)throw new Error(data.message||data.error||`HTTP ${r.status}`);const items=(data.results||[]).filter(x=>x&&x.type!=='tombstone');items.forEach(x=>postStore.set(String(x.id||''),x));const html=viewMode==='roll'?rollHTML(items):items.map(x=>postHTML(x)).join('');if(append&&viewMode!=='roll')results.insertAdjacentHTML('beforeend',html);else if(append&&viewMode==='roll'){const cells=document.createElement('div');cells.innerHTML=html;const grid=results.querySelector('.roll-grid');cells.querySelectorAll('.roll-item').forEach(x=>grid.appendChild(x))}else results.innerHTML=html||'<div class="empty">該当する投稿がありません。</div>';const next=data.cursor?.bottom;loadMore.hidden=!next||next===cursor||!items.length;cursor=next||null;history.replaceState({fxView:viewMode==='profile'?'profile':'search'},'',`#q=${encodeURIComponent(q)}&feed=${viewMode==='roll'?'roll':feed}`)}catch(e){const msg=e instanceof TypeError?'APIへの接続に失敗しました。ブラウザのCORS制限、通信障害、またはAPI停止の可能性があります。':e.message;results.innerHTML=`<div class="status">${esc(msg)}</div>`;loadMore.hidden=true}finally{loading=false;$('#searchButton').disabled=false;loadMore.disabled=false}}
$('#form').addEventListener('submit',e=>{e.preventDefault();closeCommandMenu();search(false)});loadMore.addEventListener('click',()=>search(true));
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');viewMode=t.dataset.feed==='roll'?'roll':'posts';feed=t.dataset.feed==='roll'?'media':t.dataset.feed;profileHandle='';search(false)});
wireInteractions(results);wireInteractions($('#detailModal'));wireInteractions($('#imageModal'));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});document.addEventListener('click',e=>{if(!e.target.closest('.external'))document.querySelectorAll('.external-menu.open').forEach(x=>x.classList.remove('open'))});
const commandMenu=$('#commandMenu'),commandMenuButton=$('#commandMenuButton');
function openCommandMenu(){commandMenu.hidden=false;commandMenuButton.setAttribute('aria-expanded','true');document.body.classList.add('modal-open')}
function closeCommandMenu(){commandMenu.hidden=true;commandMenuButton.setAttribute('aria-expanded','false');document.body.classList.remove('modal-open')}
function queryTokens(){return $('#query').value.trim().split(/\s+/).filter(Boolean)}
function setQueryTokens(tokens){$('#query').value=[...new Set(tokens)].join(' ').trim();syncCommandChips()}
function addToken(token){if(!token)return;const tokens=queryTokens();if(!tokens.includes(token))tokens.push(token);setQueryTokens(tokens)}
function toggleToken(token){let tokens=queryTokens();tokens=tokens.includes(token)?tokens.filter(x=>x!==token):[...tokens,token];setQueryTokens(tokens)}
function syncCommandChips(){
 const tokens=queryTokens();
 document.querySelectorAll('.command-chip[data-token]').forEach(b=>b.classList.toggle('selected',tokens.includes(b.dataset.token)));
 const keyword=$('#commandKeyword')?.value.trim().replace(/^"|"$/g,'')||'';
 const user=$('#commandUser')?.value.trim().replace(/^@/,'')||'';
 document.querySelectorAll('.command-action').forEach(b=>{
  let selected=false;
  if(b.dataset.action==='keyword'&&keyword)selected=tokens.includes(keyword);
  if(b.dataset.action==='phrase'&&keyword)selected=tokens.includes(`"${keyword}"`);
  if(b.dataset.prefix!==undefined&&user)selected=tokens.includes(b.dataset.prefix+user);
  b.classList.toggle('selected',selected);
 });
}
function commandFeedback(message,input){const box=$('#commandMessage');if(box)box.textContent=message||'';document.querySelectorAll('.command-input.input-error').forEach(x=>x.classList.remove('input-error'));if(input){input.classList.add('input-error');input.focus()}}
commandMenuButton.addEventListener('click',()=>commandMenu.hidden?openCommandMenu():closeCommandMenu());
$('#commandMenuClose').addEventListener('click',closeCommandMenu);$('#commandDone').addEventListener('click',closeCommandMenu);
document.querySelectorAll('.command-chip[data-token]').forEach(b=>b.addEventListener('click',()=>toggleToken(b.dataset.token)));
commandMenu.addEventListener('click',e=>{const b=e.target.closest('.command-action');if(!b)return;e.preventDefault();e.stopPropagation();const prefix=b.dataset.prefix;if(prefix!==undefined){const input=$('#commandUser'),user=input.value.trim().replace(/^@/,'');if(!user){commandFeedback('先にユーザー名を入力してください。',input);return}addToken(prefix+user);commandFeedback('検索欄へ追加しました。');return}switch(b.dataset.action){case'keyword':case'phrase':{const input=$('#commandKeyword'),v=input.value.trim().replace(/^"|"$/g,'');if(!v){commandFeedback('先に検索語を入力してください。',input);return}addToken(b.dataset.action==='phrase'?`"${v}"`:v);commandFeedback('検索欄へ追加しました。');break}case'date':{const a=$('#commandSince').value,z=$('#commandUntil').value;if(!a&&!z){commandFeedback('開始日または終了日を選んでください。',$('#commandSince'));return}if(a)addToken('since:'+a);if(z)addToken('until:'+z);commandFeedback('期間を検索欄へ追加しました。');break}case'counts':{const f=$('#commandFaves').value,r=$('#commandRetweets').value,p=$('#commandReplies').value;if(f===''&&r===''&&p===''){commandFeedback('反応数を1つ以上入力してください。',$('#commandFaves'));return}if(f!=='')addToken('min_faves:'+f);if(r!=='')addToken('min_retweets:'+r);if(p!=='')addToken('min_replies:'+p);commandFeedback('反応数を検索欄へ追加しました。');break}}});
$('#commandClear').addEventListener('click',()=>{setQueryTokens([]);document.querySelectorAll('#commandMenu input').forEach(x=>x.value='');commandFeedback('')});
$('#query').addEventListener('input',syncCommandChips);
$('#commandKeyword').addEventListener('input',syncCommandChips);
$('#commandUser').addEventListener('input',syncCommandChips);
window.addEventListener('popstate',e=>{applyingPopState=true;try{const state=e.state||{};const hash=new URLSearchParams(location.hash.slice(1));const postId=state.fxView==='detail'?state.postId:hash.get('post');if(postId&&postStore.has(String(postId))){if(detailPostId&&detailPostId!==String(postId)&&detailHistory.at(-1)===String(postId))detailHistory.pop();renderDetail(String(postId))}else{hideModals();detailHistory=[];detailPostId=''}}finally{applyingPopState=false}});
const p=new URLSearchParams(location.hash.slice(1));if(p.get('profile')){profileFeed=p.get('profileFeed')==='top'?'top':'latest';openProfile(p.get('profile'))}else if(p.get('q')){$('#query').value=p.get('q');const saved=p.get('feed')||'latest';viewMode=saved==='roll'?'roll':'posts';feed=saved==='roll'?'media':saved;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.feed===saved));search(false)}
</script>
